<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma poulette — Bijoux artisanaux</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <div class="menu-categories">
      <button id="bouton-menu-categories" class="bouton-menu-categories" type="button" aria-label="Ouvrir les catégories" aria-expanded="false" aria-controls="liens-categories">
        <span></span><span></span><span></span>
      </button>
      <nav id="liens-categories" class="liens-categories" aria-label="Aller directement à une catégorie" hidden>
        <a href="#bracelets">Bracelets</a>
        <a href="#colliers">Colliers</a>
        <a href="#bagues">Bagues</a>
        <a href="#boucles-oreilles">Boucles d’oreilles</a>
        <a href="custom.html">Créer mon bijou</a>
      </nav>
    </div>
    <h1 class="titre-site"><img class="logo-titre" src="logo.png" alt="Ma Poulette"></h1>
    <p class="sous-titre-site"><span class="coeur-logo" aria-hidden="true">♥</span><span>Bijoux confectionnés avec amour</span><span class="coeur-logo" aria-hidden="true">♥</span></p>
    <a href="panier.html" class="panier-bouton" title="Voir mon panier">
      <span class="visually-hidden">Voir mon panier</span>
      <img src="panier-osier.svg" alt="">
      <span id="compteur-panier" class="compteur-panier" aria-live="polite">0</span>
    </a>
  </header>

  <section class="diaporama" aria-label="Diaporama de photos de bijoux">
    <div class="diaporama-interieur">
      <div class="diaporama-vues" aria-live="off">
        <article class="diapo is-active" aria-roledescription="diapositive" aria-label="1 sur 4">
          <img src="media/products/Capture d'écran 2026-09-25 210447.png" alt="Bracelet de perles aux nuances vertes et ivoire sur bois">
        </article>
        <article class="diapo" aria-roledescription="diapositive" aria-label="2 sur 4" aria-hidden="true">
          <img src="media/carousel/colliers-inspiration.jpg" alt="Plusieurs colliers fins portés ensemble">
        </article>
        <article class="diapo" aria-roledescription="diapositive" aria-label="3 sur 4" aria-hidden="true">
          <img src="media/carousel/bagues-inspiration.jpg" alt="Deux bagues dorées posées sur une pierre claire">
        </article>
        <article class="diapo" aria-roledescription="diapositive" aria-label="4 sur 4" aria-hidden="true">
          <img src="media/carousel/pendentifs-inspiration.jpg" alt="Pendentifs et chaînes dorés avec une pierre bleu profond">
        </article>
      </div>
      <div class="diaporama-commandes" aria-label="Commandes du diaporama">
        <button class="diapo-fleche" id="diapo-precedente" type="button" aria-label="Photo précédente">&larr;</button>
        <div class="diapo-points" aria-label="Choisir une photo">
          <button type="button" class="diapo-point is-active" aria-label="Afficher la photo 1" aria-current="true"></button>
          <button type="button" class="diapo-point" aria-label="Afficher la photo 2"></button>
          <button type="button" class="diapo-point" aria-label="Afficher la photo 3"></button>
          <button type="button" class="diapo-point" aria-label="Afficher la photo 4"></button>
        </div>
        <button class="diapo-fleche" id="diapo-suivante" type="button" aria-label="Photo suivante">&rarr;</button>
        <button class="diapo-pause" id="diapo-pause" type="button" aria-label="Mettre le diaporama en pause" aria-pressed="false"><span></span><span></span></button>
      </div>
    </div>
  </section>

  <main>
<h2>Nos créations</h2>

  <section class="catalogue-categories" id="liste-produits" aria-live="polite">
    <p class="catalogue-vide">Chargement des créations...</p>
  </section>
  </main>

  <footer>
    <p>© 2026 Ma poulette</p>
    <a href="mentions-legales.html" target="_blank" rel="noopener noreferrer">Consulter les mentions légales</a>
    <a class="lien-admin" href="admin.html">Gérer la boutique</a>
  </footer>
  <script src="script.js"></script>
</body>
</html>
